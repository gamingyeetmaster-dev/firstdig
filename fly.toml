# Fly.io config. One small machine with a persistent volume is enough.
#   fly launch --copy-config --no-deploy   (creates the app)
#   fly volumes create data --size 3 --region yyz
#   fly secrets set SECRET_KEY=... CRON_SECRET=... RESEND_API_KEY=... STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... STRIPE_PRICE_TEARDOWN=... STRIPE_PRICE_OPENINGS=... STRIPE_PRICE_BUNDLE=... ADMIN_EMAILS=you@example.com EMAIL_FROM="Toronto Signals <hello@yourdomain>" BASE_URL=https://yourdomain
#   fly deploy
app = "torontosignals"
primary_region = "yyz"

[build]

[env]
  DATA_DIR = "/data"
  DB_PATH = "/data/signals.db"
  ENABLE_SCHEDULER = "1"
  DEV_MODE = "0"
  REFRESH_HOUR = "6"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
