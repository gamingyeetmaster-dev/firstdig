# Zero-cost wake-up for the in-process Toronto scheduler.
# Render free services can sleep; these two UTC wake times bracket 06:00 Toronto
# across daylight/standard time. Only the wake that lands in the configured
# 06:00 local hour can trigger the scheduler.
name: daily refresh
on:
  schedule:
    - cron: "5 10 * * *"   # 06:05 EDT / 05:05 EST
    - cron: "5 11 * * *"   # 07:05 EDT / 06:05 EST
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake First Dig
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 5 "https://first-dig-night-shift.onrender.com/health"
