# Wake existing free Render instance. HTTP 200 alone is NOT a successful refresh.
name: daily refresh
on:
  schedule:
    - cron: "5 10 * * *"   # 06:05 EDT / 05:05 EST
    - cron: "5 11 * * *"   # 07:05 EDT / 06:05 EST
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wake First Dig
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 5 "https://first-dig-night-shift.onrender.com/health"
      - name: Verify actual data freshness
        run: python scripts/check_health.py
