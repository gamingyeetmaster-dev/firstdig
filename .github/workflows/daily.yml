# Wake existing free Render instance. HTTP 200 alone is NOT a successful refresh.
name: daily refresh
on:
  schedule:
    # GitHub warns that start-of-hour load can delay or drop scheduled runs.
    # Use an off-peak minute while preserving two DST-safe wake windows.
    - cron: "37 10 * * *"  # 06:37 EDT / 05:37 EST
    - cron: "37 11 * * *"  # 07:37 EDT / 06:37 EST
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wake First Dig
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 5 "https://first-dig-night-shift.onrender.com/health"
      - name: Verify actual data freshness
        run: python scripts/check_health.py
