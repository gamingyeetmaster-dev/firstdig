name: Public Snapshot QA

on:
  push:
    branches: [public-static]
  workflow_dispatch:

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for static deploy and verify populated data
        env:
          URL: https://firstdig-public.onrender.com
        run: |
          set -euo pipefail
          ok=0
          projects=0
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/t.json -w '%{http_code}' --max-time 20 "$URL/data/teardown.json" || true)
            if [ "$code" = "200" ]; then
              projects=$(python -c "import json; print(len(json.load(open('/tmp/t.json')).get('records', [])))")
              if [ "$projects" -gt 0 ]; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = "1"
          echo "teardown records=$projects"
          curl -fsS --max-time 20 "$URL/data/openings.json" -o /tmp/o.json
          python -c "import json; a=json.load(open('/tmp/t.json')); b=json.load(open('/tmp/o.json')); assert len(a.get('records',[]))>0; assert len(b.get('records',[]))>0; print('teardown',len(a['records']),'total',a.get('total'),'generated',a.get('generated_at')); print('openings',len(b['records']),'total',b.get('total'),'generated',b.get('generated_at'))"

      - name: Verify public pages and response times
        env:
          URL: https://firstdig-public.onrender.com
        run: |
          set -euo pipefail
          for p in / /teardown /openings /pricing /methodology /terms /static/public-dashboard.js; do
            out=$(curl -sS -L -o /dev/null -w '%{http_code} %{time_total}' --max-time 20 "$URL$p")
            echo "$p $out"
            code=$(echo "$out" | awk '{print $1}')
            test "$code" = "200"
          done
          curl -fsS --max-time 20 "$URL/teardown" -o /tmp/page.html
          grep -q 'public-dashboard.js' /tmp/page.html
          grep -q 'First Dig' /tmp/page.html
